name: Validate Pokemon Signals

on:
  push:
    paths:
      - "signals.json"
      - ".github/workflows/validate-signals.yml"
  pull_request:
    paths:
      - "signals.json"
      - ".github/workflows/validate-signals.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signals.json
        shell: python
        run: |
          import json
          from urllib.parse import urlparse

          with open("signals.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data, dict)
          assert data.get("version") == 1
          assert isinstance(data.get("products"), list)

          allowed_stock = {
              "in_stock",
              "out_of_stock",
              "unknown",
          }

          allowed_hosts = {
              "walmart.ca",
              "www.walmart.ca",
              "costco.ca",
              "www.costco.ca",
              "pokemoncenter.com",
              "www.pokemoncenter.com",
          }

          for product in data["products"]:
              assert isinstance(product, dict)

              title = product.get("title", "")
              url = product.get("url", "")
              stock = product.get("stock", "unknown")

              assert isinstance(title, str) and title.strip()
              assert isinstance(url, str) and url.startswith("https://")
              assert stock in allowed_stock

              host = (urlparse(url).hostname or "").lower()
              assert (
                  host in allowed_hosts
                  or host.endswith(".walmart.ca")
                  or host.endswith(".costco.ca")
                  or host.endswith(".pokemoncenter.com")
              ), f"Unsupported retailer domain: {host}"
