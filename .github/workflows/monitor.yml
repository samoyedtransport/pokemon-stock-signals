name: Direct Stock Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  pull_request:
    paths:
      - 'monitor.py'
      - 'test_monitor.py'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: pokemon-direct-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offer verification
        run: python -m unittest -v test_monitor
      - name: Check direct product stock and alert
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Save observations and delivered-alert state
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name 'pokemon-stock-bot'
          git config user.email 'pokemon-stock-bot@users.noreply.github.com'
          git add signals.json
          if test -f stock-state.json; then git add stock-state.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save direct stock observations'
          git pull --rebase origin main
          git push
