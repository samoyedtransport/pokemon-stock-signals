name: Direct Stock Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '2-57/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'monitor.py'
      - 'catalogue.py'
      - 'retailers.json'
      - 'test_catalogue.py'
      - 'worker.py'
      - 'watchlist.json'
      - '.github/workflows/monitor.yml'
  pull_request:
    paths:
      - 'monitor.py'
      - 'catalogue.py'
      - 'retailers.json'
      - 'test_catalogue.py'
      - 'test_monitor.py'
      - 'worker.py'
      - 'watchlist.json'
      - '.github/workflows/monitor.yml'
permissions:
  contents: write
concurrency:
  group: pokemon-retail-discovery
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test offer verification
        run: python -m unittest -v test_monitor test_catalogue
      - name: Check direct product stock and alert
        if: github.event_name != 'pull_request'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python monitor.py --test-alert
          else
            python monitor.py
          fi
      - name: Upload stock and delivery health report
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: monitor-health
          path: monitor-report.json
          retention-days: 7
      - name: Save observations and delivered-alert state
        if: always() && github.event_name != 'pull_request'
        run: |
          git config user.name 'pokemon-stock-bot'
          git config user.email 'pokemon-stock-bot@users.noreply.github.com'
          if test -f stock-state.json; then git add stock-state.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Save direct stock observations'
          git pull --rebase origin main
          git push
